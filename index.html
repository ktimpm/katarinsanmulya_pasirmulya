  <style>
/* ==================================================================
   GAYA TAMPILAN — KARANG TARUNA "INSAN MULYA"
   Palet: royal navy #2A4EC8 (navy kop surat #16245A diterangkan +-50%) | emas #E9B824 | emas cerah #FFDB66 (teks di atas biru) | putih #FFFFFF | abu #F4F6FB
   Font : Plus Jakarta Sans (judul) + Inter (isi)
   ================================================================== */

:root {
  --marun: #2A4EC8;
  --marun-tua: #1E3B99;
  --marun-gelap: #1A3187;
  --emas: #E9B824;
  --emas-terang: #FFDB66; /* emas cerah: khusus TEKS di atas latar biru */
  --emas-tua: #C99F13;
  --putih: #FFFFFF;
  --abu: #F4F6FB;
  --teks: #1A2138;
  --teks-lembut: #4E5877;
  --garis: #DFE4F2;
  --hijau-wa: #0F7B3F;
  --hijau-wa-tua: #0C6533;
  --font-judul: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
  --font-isi: 'Inter', 'Open Sans', 'Segoe UI', Arial, sans-serif;
  --radius: 14px;
  --bayangan: 0 2px 12px rgba(30, 59, 153, 0.08);
  --tinggi-header: 64px;
}

* , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--tinggi-header) + 14px);
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-isi);
  font-size: 16px;
  line-height: 1.7;
  color: var(--teks);
  background: var(--putih);
  overflow-x: hidden;
}

img { max-width: 100%; display: block; }
ul, ol { list-style: none; }
a { color: var(--marun); }
button { font: inherit; }

h1, h2, h3, h4 { font-family: var(--font-judul); line-height: 1.3; color: var(--marun-tua); }

::selection { background: var(--emas); color: #3A2A00; }

/* Fokus keyboard terlihat jelas */
:focus-visible {
  outline: 3px solid var(--emas);
  outline-offset: 2px;
  border-radius: 4px;
}

/* Tautan lompat ke konten (untuk pengguna keyboard) */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 2000;
  background: var(--putih);
  color: var(--marun);
  font-family: var(--font-judul);
  font-weight: 700;
  padding: 12px 20px;
  border: 2px solid var(--emas);
  border-radius: 0 0 10px 0;
}
.skip-link:focus { left: 0; }

/* ============================ TATA LETAK ============================ */

.container {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 20px;
}

.section { padding: 56px 0; }
.bg-abu { background: var(--abu); }
.bg-putih { background: var(--putih); }
.blok { padding: 56px 0; }

/* Judul seksi */
.section-head { text-align: center; max-width: 680px; margin: 0 auto 38px; }
.section-title {
  font-size: clamp(1.45rem, 4vw, 1.9rem);
  font-weight: 800;
  color: var(--marun);
  letter-spacing: 0.2px;
}
.section-title::after {
  content: "";
  display: block;
  width: 64px;
  height: 4px;
  border-radius: 4px;
  background: var(--emas);
  margin: 12px auto 0;
}
.section-sub { margin-top: 12px; font-size: 0.98rem; color: var(--teks-lembut); }

/* Label anak-judul (Visi, Misi, Dasar Hukum, Agenda, Galeri) */
.subjudul {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--marun);
  padding-left: 12px;
  border-left: 4px solid var(--emas);
  margin-bottom: 16px;
}

/* ============================ TOMBOL ============================ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 46px;
  padding: 11px 26px;
  border-radius: 999px;
  border: 2px solid transparent;
  font-family: var(--font-judul);
  font-weight: 700;
  font-size: 0.92rem;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:active { transform: translateY(1px); }

.btn--emas { background: var(--emas); color: #3A2A00; }
.btn--emas:hover { background: var(--emas-tua); }

.btn--marun { background: var(--marun); color: #fff; }
.btn--marun:hover { background: var(--marun-tua); }

.btn--garis { border-color: rgba(232, 236, 248, 0.88); color: #fff; }
.btn--garis:hover { background: #fff; color: var(--marun); }

.btn--wa { background: var(--hijau-wa); color: #fff; }
.btn--wa:hover { background: var(--hijau-wa-tua); border-color: var(--emas); }

.btn--email { background: #fff; color: var(--marun); border-color: var(--marun); }
.btn--email:hover { background: var(--marun); color: #fff; }

/* ============================ HEADER ============================ */

.site-header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: var(--marun);
  box-shadow: 0 3px 14px rgba(13, 25, 70, 0.35);
  border-bottom: 3px solid var(--emas);
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: var(--tinggi-header);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  text-decoration: none;
  color: #fff;
  min-width: 0;
}
.brand-logo {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 50%;
  background: #fff;
  padding: 2px;
  object-fit: cover;
}
.brand-teks { display: flex; flex-direction: column; min-width: 0; }
.brand-nama {
  font-family: var(--font-judul);
  font-weight: 800;
  font-size: 0.98rem;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-sub {
  font-size: 0.72rem;
  color: rgba(232, 236, 248, 0.85);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Menu desktop (tersembunyi di HP) */
.nav-list { display: none; }
.nav-list li { margin-left: 4px; }
.nav-link {
  position: relative;
  display: inline-block;
  padding: 8px 13px;
  font-family: var(--font-judul);
  font-weight: 600;
  font-size: 0.9rem;
  color: rgba(232, 236, 248, 0.94);
  text-decoration: none;
  border-radius: 8px;
  transition: color 0.2s ease;
}
.nav-link::after {
  content: "";
  position: absolute;
  left: 13px;
  right: 13px;
  bottom: 3px;
  height: 3px;
  border-radius: 3px;
  background: var(--emas);
  transform: scaleX(0);
  transform-origin: center;
  transition: transform 0.2s ease;
}
.nav-link:hover { color: var(--emas-terang); }
.nav-link.is-active { color: var(--emas-terang); }
.nav-link.is-active::after { transform: scaleX(1); }

/* Tombol hamburger */
.nav-toggle {
  display: inline-flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  width: 46px;
  height: 46px;
  background: transparent;
  border: 2px solid rgba(255, 255, 255, 0.5);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color 0.2s ease;
}
.nav-toggle:hover { border-color: var(--emas); }
.nav-toggle-garis {
  display: block;
  width: 22px;
  height: 2.5px;
  border-radius: 2px;
  background: #fff;
  transition: transform 0.25s ease, opacity 0.25s ease;
}
.nav-toggle[aria-expanded="true"] .nav-toggle-garis:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] .nav-toggle-garis:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] .nav-toggle-garis:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

/* Menu ponsel */
.nav-mobile {
  display: none;
  background: var(--marun-tua);
  border-top: 1px solid rgba(255, 255, 255, 0.14);
  padding: 8px 0 14px;
}
.nav-mobile.is-open { display: block; }
.nav-mobile a {
  display: block;
  padding: 13px 24px;
  font-family: var(--font-judul);
  font-weight: 600;
  font-size: 0.95rem;
  color: rgba(232, 236, 248, 0.94);
  text-decoration: none;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.nav-mobile a:hover, .nav-mobile a.is-active { color: var(--emas-terang); background: rgba(255, 255, 255, 0.05); }

@media (min-width: 900px) {
  :root { --tinggi-header: 70px; }
  .nav-list { display: flex; align-items: center; }
  .nav-toggle { display: none; }
  .nav-mobile, .nav-mobile.is-open { display: none; }
  .brand-logo { width: 50px; height: 50px; }
  .brand-nama { font-size: 1.05rem; }
  .brand-sub { font-size: 0.76rem; }
}

/* ============================ HERO ============================ */

.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(155deg, var(--marun-gelap) 0%, var(--marun) 55%, #4768D9 100%);
  color: #fff;
  text-align: center;
  padding: 68px 0 88px;
  border-bottom: 5px solid var(--emas);
}
.hero::before, .hero::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.hero::before {
  width: 460px; height: 460px;
  left: -160px; top: -180px;
  background: radial-gradient(circle, rgba(255, 219, 102, 0.20) 0%, rgba(233, 184, 36, 0) 70%);
}
.hero::after {
  width: 520px; height: 520px;
  right: -200px; bottom: -240px;
  background: radial-gradient(circle, rgba(255, 219, 102, 0.16) 0%, rgba(233, 184, 36, 0) 70%);
}

.hero-inner { position: relative; max-width: 780px; }
.hero-pill {
  display: inline-block;
  font-family: var(--font-judul);
  font-weight: 700;
  font-size: 0.74rem;
  letter-spacing: 2.2px;
  text-transform: uppercase;
  color: var(--emas-terang);
  border: 1.5px solid rgba(255, 219, 102, 0.70);
  border-radius: 999px;
  padding: 6px 18px;
  margin-bottom: 20px;
  background: rgba(0, 0, 0, 0.14);
}
.hero-judul {
  color: #fff;
  font-size: clamp(1.85rem, 6.4vw, 3.1rem);
  font-weight: 800;
  letter-spacing: 0.4px;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.25);
}
.hero-sub {
  margin-top: 12px;
  font-family: var(--font-judul);
  font-weight: 600;
  font-size: clamp(0.98rem, 3vw, 1.2rem);
  color: var(--emas-terang);
  letter-spacing: 0.4px;
}
.hero-tag {
  margin: 16px auto 0;
  max-width: 620px;
  font-size: clamp(0.98rem, 2.6vw, 1.08rem);
  color: rgba(232, 236, 248, 0.96);
}
.hero-cta {
  margin-top: 30px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
}

/* ============================ ANGKA RINGKAS ============================ */

.stats-wrap { position: relative; z-index: 5; margin-top: -38px; }
.stats-card {
  background: #fff;
  border: 1px solid var(--garis);
  border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(30, 59, 153, 0.12);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  overflow: hidden;
}
.stat {
  text-align: center;
  padding: 20px 10px 18px;
}
.stat + .stat { border-left: 1px solid var(--garis); }
.stat-angka {
  font-family: var(--font-judul);
  font-weight: 800;
  font-size: clamp(1.35rem, 4.6vw, 2.1rem);
  color: var(--marun);
  line-height: 1.15;
}
.stat-label {
  margin-top: 2px;
  font-family: var(--font-judul);
  font-weight: 600;
  font-size: 0.8rem;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--teks-lembut);
}

/* ============================ SAMBUTAN ============================ */

.sambutan-card {
  background: #fff;
  border: 1px solid var(--garis);
  border-radius: 18px;
  box-shadow: var(--bayangan);
  padding: 26px 22px;
  display: grid;
  gap: 24px;
}
.sambutan-card + .sambutan-card { margin-top: 28px; }
.sambutan-judul {
  font-size: clamp(1.15rem, 3.4vw, 1.42rem);
  font-weight: 700;
  color: var(--marun);
  margin-bottom: 4px;
}
.sambutan-judul::after {
  content: "";
  display: block;
  width: 54px;
  height: 4px;
  border-radius: 4px;
  background: var(--emas);
  margin-top: 10px;
}

.foto-slot { text-align: center; }
.foto-placeholder {
  width: 158px;
  height: 158px;
  margin: 0 auto;
  border-radius: 50%;
  background: #E3E8F6;
  border: 2.5px dashed #B4C1E2;
  color: #76829F;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 0.72rem;
  font-family: var(--font-judul);
  font-weight: 600;
  text-align: center;
  padding: 12px;
}
.foto-placeholder svg { width: 36px; height: 36px; }
.foto-img {
  width: 158px;
  height: 158px;
  margin: 0 auto;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid var(--emas);
  box-shadow: var(--bayangan);
}
.foto-ket {
  display: block;
  margin-top: 8px;
  font-size: 0.76rem;
  color: #76829F;
}

.sambutan-teks p { margin-bottom: 14px; text-align: left; }
.sambutan-teks p:last-child { margin-bottom: 0; }
.ttd { margin-top: 18px; text-align: right; }
.ttd-nama {
  font-family: var(--font-judul);
  font-weight: 700;
  font-size: 1.02rem;
  color: var(--marun);
}
.ttd-jabatan { font-size: 0.86rem; color: var(--teks-lembut); }

@media (min-width: 820px) {
  .sambutan-card { grid-template-columns: 210px 1fr; padding: 34px 36px; }
  .sambutan-teks p { text-align: justify; }
}

/* ============================ BERITA ============================ */

.kartu-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}
.berita-card {
  background: #fff;
  border: 1px solid var(--garis);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--bayangan);
  display: flex;
  flex-direction: column;
  transition: transform 0.22s ease, box-shadow 0.22s ease;
}
.berita-card:hover { transform: translateY(-4px); box-shadow: 0 12px 26px rgba(30, 59, 153, 0.13); }
.thumb-placeholder {
  aspect-ratio: 16 / 10;
  background: #E5EAF6;
  color: #76829F;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-judul);
  font-weight: 600;
  font-size: 0.8rem;
}
.thumb-placeholder svg { width: 34px; height: 34px; }
.thumb-img { aspect-ratio: 16 / 10; width: 100%; object-fit: cover; }
.berita-body { padding: 18px 20px 20px; }
.berita-judul {
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--marun-tua);
  margin-bottom: 6px;
}
.berita-ringkas { font-size: 0.9rem; color: var(--teks-lembut); }

@media (min-width: 640px) { .kartu-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 940px) { .kartu-grid { grid-template-columns: repeat(3, 1fr); } }

/* ============================ PROFIL ============================ */

.profil-grid { display: grid; gap: 26px; }
.visi-box {
  background: #fff;
  border: 1px solid var(--garis);
  border-left: 6px solid var(--emas);
  border-radius: var(--radius);
  box-shadow: var(--bayangan);
  padding: 26px 28px;
}
.visi-teks {
  font-family: var(--font-judul);
  font-weight: 600;
  font-size: 1.12rem;
  line-height: 1.65;
  color: var(--teks);
}
.misi-list li {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 13px 0;
  border-bottom: 1px solid var(--garis);
}
.misi-list li:last-child { border-bottom: none; }
.misi-num {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--emas);
  color: #3A2A00;
  font-family: var(--font-judul);
  font-weight: 700;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
}
.misi-teks { font-size: 0.98rem; }

.hukum-list li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: #fff;
  border: 1px solid var(--garis);
  border-radius: 12px;
  padding: 16px 18px;
  box-shadow: var(--bayangan);
  font-size: 0.94rem;
}
.hukum-list li + li { margin-top: 12px; }
.hukum-list svg {
  flex: none;
  width: 22px;
  height: 22px;
  color: var(--marun);
  margin-top: 3px;
}

@media (min-width: 940px) {
  .profil-dua { display: grid; grid-template-columns: 1.15fr 1fr; gap: 26px; align-items: start; }
}

/* ============================ STRUKTUR ORGANISASI ============================ */

.org-level {
  background: #fff;
  border: 1px solid var(--garis);
  border-radius: 16px;
  box-shadow: var(--bayangan);
  padding: 22px 16px;
}
.org-level-title {
  text-align: center;
  font-family: var(--font-judul);
  font-weight: 800;
  font-size: 0.92rem;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--marun);
  margin-bottom: 6px;
}
.org-level-sub {
  text-align: center;
  font-size: 0.82rem;
  color: var(--teks-lembut);
  margin-bottom: 16px;
}
.org-level-title::after {
  content: "";
  display: block;
  width: 46px;
  height: 3px;
  border-radius: 3px;
  background: var(--emas);
  margin: 8px auto 0;
}
.org-connector {
  width: 3px;
  height: 30px;
  margin: 0 auto;
  background: linear-gradient(var(--emas), var(--emas-tua));
  border-radius: 3px;
}
.org-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.role-card {
  background: #F6F8FD;
  border: 1px solid #E2E8F6;
  border-radius: 12px;
  padding: 14px 12px;
  text-align: center;
}
.role-jabatan {
  font-family: var(--font-judul);
  font-weight: 700;
  font-size: 0.74rem;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--teks-lembut);
}
.role-nama {
  margin-top: 3px;
  font-family: var(--font-judul);
  font-weight: 700;
  font-size: 0.98rem;
  color: var(--teks);
}
.role-ket { margin-top: 3px; font-size: 0.8rem; color: var(--teks-lembut); }

/* Kartu Ketua menonjol */
.role-card--ketua {
  background: linear-gradient(140deg, var(--marun) 0%, var(--marun-tua) 100%);
  border-color: var(--marun-tua);
}
.role-card--ketua .role-jabatan { color: var(--emas-terang); }
.role-card--ketua .role-nama { color: #fff; font-size: 1.12rem; }
.role-card--ketua .role-ket { color: rgba(232, 236, 248, 0.88); }

@media (min-width: 620px) { .org-grid--4 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 760px) { .org-grid--3 { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1000px) { .org-grid--4 { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 820px) {
  .ph-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .ph-grid .role-card--ketua { grid-column: 1 / -1; }
}

/* Accordion 11 bidang */
.bidang-kepala {
  text-align: center;
  font-family: var(--font-judul);
  font-weight: 800;
  font-size: 0.92rem;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--marun);
  margin: 34px 0 6px;
}
.bidang-kepala::after {
  content: "";
  display: block;
  width: 46px;
  height: 3px;
  border-radius: 3px;
  background: var(--emas);
  margin: 8px auto 0;
}
.bidang-grid { display: grid; gap: 12px; margin-top: 16px; }
details.bidang {
  background: #fff;
  border: 1px solid var(--garis);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
details.bidang[open] { border-color: #A9BCE8; box-shadow: 0 6px 18px rgba(30, 59, 153, 0.09); }
details.bidang summary {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  cursor: pointer;
  list-style: none;
  font-family: var(--font-judul);
  font-weight: 600;
  font-size: 0.92rem;
  color: #22294A;
  transition: background 0.2s ease;
}
details.bidang summary::-webkit-details-marker { display: none; }
details.bidang summary:hover { background: #EDF1FB; }
details.bidang[open] summary { background: #E9EEFA; border-bottom: 1px solid #C8D4F0; }
.bidang-num {
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--emas);
  color: #3A2A00;
  font-weight: 700;
  font-size: 0.84rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bidang-nama { flex: 1; }
.bidang-chevron { flex: none; width: 18px; height: 18px; color: var(--marun); transition: transform 0.25s ease; }
details.bidang[open] .bidang-chevron { transform: rotate(180deg); }
.bidang-isi { padding: 14px 16px 16px; }
.bidang-label { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--teks-lembut); margin-bottom: 8px; }
.chip {
  display: inline-block;
  background: #F3F6FC;
  border: 1px solid #DCE3F4;
  border-radius: 999px;
  padding: 6px 15px;
  font-size: 0.89rem;
  color: #22294A;
  margin: 0 6px 6px 0;
}
@media (min-width: 920px) { .bidang-grid { grid-template-columns: repeat(2, 1fr); } }

.catatan-struktur {
  margin-top: 28px;
  text-align: center;
  font-size: 0.87rem;
  font-style: italic;
  color: var(--teks-lembut);
}

/* ============================ PROGRAM KERJA ============================ */

.program-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 18px;
}
.program-card {
  flex: 1 1 290px;
  max-width: 350px;
  background: #fff;
  border: 1px solid var(--garis);
  border-top: 4px solid var(--emas);
  border-radius: var(--radius);
  box-shadow: var(--bayangan);
  padding: 24px 22px;
  transition: transform 0.22s ease, box-shadow 0.22s ease;
}
.program-card:hover { transform: translateY(-4px); box-shadow: 0 12px 26px rgba(30, 59, 153, 0.13); }
.program-num {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--emas);
  color: #3A2A00;
  font-family: var(--font-judul);
  font-weight: 800;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}
.program-judul { font-size: 1.06rem; font-weight: 700; color: var(--marun); margin-bottom: 8px; }
.program-desk { font-size: 0.93rem; color: #2E3550; }


/* Banner Program Unggulan */
.unggulan {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px;
  background: linear-gradient(135deg, var(--marun-tua), var(--marun-gelap));
  border-radius: var(--radius); border-left: 6px solid var(--emas);
  box-shadow: var(--bayangan); padding: 28px 30px; margin: 0 auto 26px; max-width: 1040px;
}
.unggulan-teks { flex: 1 1 320px; color: #E8ECF8; }
.unggulan-label { display: inline-block; background: var(--emas); color: #3A2A00; font-family: var(--font-judul); font-weight: 800; font-size: 0.74rem; letter-spacing: 0.6px; text-transform: uppercase; padding: 3px 12px; border-radius: 999px; }
.unggulan-judul { color: #fff; font-size: clamp(1.3rem, 3.5vw, 1.7rem); font-weight: 800; margin: 10px 0 6px; }
.unggulan-teks p { font-size: 0.98rem; }

/* Tabel agenda */
.agenda-wrap { margin-top: 46px; }
.tabel-bungkus {
  background: #fff;
  border: 1px solid var(--garis);
  border-radius: var(--radius);
  box-shadow: var(--bayangan);
  overflow: hidden;
}
.tabel-agenda { width: 100%; border-collapse: collapse; }
.tabel-agenda thead th {
  background: var(--marun);
  color: #fff;
  font-family: var(--font-judul);
  font-weight: 700;
  font-size: 0.82rem;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  text-align: left;
  padding: 13px 16px;
}
.tabel-agenda tbody td {
  padding: 14px 16px;
  border-bottom: 1px solid #E6EAF5;
  font-size: 0.93rem;
  vertical-align: top;
}
.tabel-agenda tbody tr:nth-child(even) td { background: #F7F9FD; }
.tabel-agenda tbody tr:last-child td { border-bottom: none; }
.badge-status {
  display: inline-block;
  background: #E8EDFB;
  border: 1px solid #C5D2F0;
  color: #24357A;
  border-radius: 999px;
  padding: 3px 13px;
  font-size: 0.8rem;
  font-weight: 500;
  white-space: nowrap;
}

/* Tabel jadi kartu bertumpuk di HP */
@media (max-width: 719px) {
  .tabel-agenda thead { display: none; }
  .tabel-agenda, .tabel-agenda tbody, .tabel-agenda tr, .tabel-agenda td { display: block; width: 100%; }
  .tabel-agenda tbody tr { border-bottom: 1px solid #E6EAF5; padding: 6px 0; }
  .tabel-agenda tbody tr:last-child { border-bottom: none; }
  .tabel-agenda tbody td {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 18px;
    border: none;
    padding: 7px 16px;
    background: transparent !important;
  }
  .tabel-agenda tbody td::before {
    content: attr(data-label);
    flex: none;
    font-family: var(--font-judul);
    font-weight: 700;
    font-size: 0.76rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--marun);
  }
}

/* Galeri */
.galeri-wrap { margin-top: 46px; }
.galeri-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.galeri-item {
  aspect-ratio: 4 / 3;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}
.galeri-placeholder {
  width: 100%;
  height: 100%;
  background: #E5EAF6;
  border: 1.5px dashed #B4C1E2;
  border-radius: 12px;
  color: #76829F;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-judul);
  font-weight: 600;
  font-size: 0.78rem;
  text-align: center;
  padding: 10px;
}
.galeri-placeholder svg { width: 32px; height: 32px; }
.galeri-img { width: 100%; height: 100%; object-fit: cover; }
@media (min-width: 780px) { .galeri-grid { grid-template-columns: repeat(3, 1fr); } }

/* ============================ KONTAK ============================ */

.kontak-grid { display: grid; gap: 22px; }
.info-list { display: grid; gap: 13px; }
.info-item {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  background: #fff;
  border: 1px solid var(--garis);
  border-radius: 12px;
  box-shadow: var(--bayangan);
  padding: 15px 17px;
}
.info-ikon {
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--marun);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.info-ikon svg { width: 20px; height: 20px; }
.info-label {
  font-family: var(--font-judul);
  font-weight: 700;
  font-size: 0.74rem;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--teks-lembut);
}
.info-nilai { font-size: 0.96rem; font-weight: 500; color: var(--teks); overflow-wrap: anywhere; }
.info-nilai a { color: var(--marun); text-decoration: underline; text-decoration-color: rgba(42, 78, 200, 0.45); text-underline-offset: 3px; }
.info-nilai a:hover { text-decoration-color: var(--emas-tua); }

.wa-card {
  margin-top: 13px;
  background: #fff;
  border: 1px solid var(--garis);
  border-radius: 12px;
  box-shadow: var(--bayangan);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.wa-card-teks { font-size: 0.9rem; color: var(--teks-lembut); }
.wa-card-teks strong { display: block; font-family: var(--font-judul); color: var(--teks); font-size: 0.96rem; }

.map-card {
  background: #fff;
  border: 1px solid var(--garis);
  border-radius: var(--radius);
  box-shadow: var(--bayangan);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.map-card iframe {
  width: 100%;
  height: 100%;
  min-height: 330px;
  border: 0;
  display: block;
  flex: 1;
}
.map-ket {
  padding: 10px 16px;
  font-size: 0.8rem;
  color: var(--teks-lembut);
  border-top: 1px solid var(--garis);
  background: #F7F9FD;
}

@media (min-width: 920px) {
  .kontak-grid { grid-template-columns: 1.05fr 0.95fr; align-items: stretch; }
  .map-card iframe { min-height: 430px; }
}

/* Formulir aspirasi */
.form-card {
  margin-top: 42px;
  background: #fff;
  border: 1px solid var(--garis);
  border-radius: 18px;
  box-shadow: var(--bayangan);
  padding: 30px 22px;
  max-width: 780px;
  margin-left: auto;
  margin-right: auto;
}
.form-judul { font-size: 1.25rem; font-weight: 700; color: var(--marun); }
.form-sub { margin: 6px 0 22px; font-size: 0.92rem; color: var(--teks-lembut); }
.form-grid { display: grid; gap: 16px; }
.form-field label {
  display: block;
  font-family: var(--font-judul);
  font-weight: 600;
  font-size: 0.87rem;
  color: var(--teks);
  margin-bottom: 7px;
}
.wajib { color: #9C2A3C; }
.form-field input,
.form-field select,
.form-field textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #C7D0E8;
  border-radius: 10px;
  font: inherit;
  font-size: 0.95rem;
  color: var(--teks);
  background: #FDFEFF;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.form-field input::placeholder, .form-field textarea::placeholder { color: #96A0BC; }
.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus {
  outline: none;
  border-color: var(--emas);
  box-shadow: 0 0 0 3px rgba(233, 184, 36, 0.28);
}
.form-field textarea { resize: vertical; min-height: 120px; }
.form-aksi { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.form-catatan { margin-top: 15px; font-size: 0.82rem; color: var(--teks-lembut); }
@media (min-width: 680px) {
  .form-grid { grid-template-columns: 1fr 1fr; }
  .form-field--full { grid-column: 1 / -1; }
}

/* ============================ FOOTER ============================ */

.site-footer {
  background: var(--marun-tua);
  color: rgba(232, 236, 248, 0.90);
  border-top: 5px solid var(--emas);
}
.footer-atas { padding: 48px 0 34px; }
.footer-grid { display: grid; gap: 30px; }
.footer-brand { display: flex; gap: 14px; align-items: flex-start; }
.footer-logo {
  width: 54px;
  height: 54px;
  flex: none;
  border-radius: 50%;
  background: #fff;
  padding: 2px;
}
.footer-nama { font-family: var(--font-judul); font-weight: 800; font-size: 1.05rem; color: #fff; }
.footer-tagline { margin-top: 5px; font-size: 0.85rem; color: rgba(232, 236, 248, 0.78); }
.footer-title {
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--emas-terang);
  margin-bottom: 15px;
}
.footer-list li {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 11px;
  font-size: 0.92rem;
}
.footer-list svg { flex: none; width: 16px; height: 16px; color: var(--emas); margin-top: 4px; }
.footer-list a, .footer-tautan a {
  color: rgba(232, 236, 248, 0.90);
  text-decoration: none;
  transition: color 0.2s ease;
}
.footer-list a:hover, .footer-tautan a:hover { color: var(--emas-terang); }
.footer-tautan li { margin-bottom: 10px; font-size: 0.92rem; }
.footer-tautan a { display: inline-flex; align-items: center; gap: 7px; }
.footer-tautan svg { width: 14px; height: 14px; }
.footer-bawah {
  border-top: 1px solid rgba(255, 255, 255, 0.16);
  padding: 18px 0;
  text-align: center;
  font-size: 0.84rem;
  color: rgba(232, 236, 248, 0.75);
}
@media (min-width: 860px) { .footer-grid { grid-template-columns: 1.25fr 1.25fr 0.8fr; gap: 36px; } }

/* ============================ TOMBOL KEMBALI KE ATAS ============================ */

.ke-atas {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 900;
  width: 47px;
  height: 47px;
  border-radius: 50%;
  border: 2px solid var(--emas);
  background: var(--marun);
  color: var(--emas-terang);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(13, 25, 70, 0.35);
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s, background 0.2s ease;
}
.ke-atas svg { width: 20px; height: 20px; }
.ke-atas:hover { background: var(--marun-gelap); }
.ke-atas.is-visible { opacity: 1; visibility: visible; transform: none; }

/* ============================ ANIMASI ============================ */

.reveal {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.reveal.is-visible { opacity: 1; transform: none; }

/* Hormati pengaturan "kurangi gerakan" */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .reveal { opacity: 1; transform: none; }
}

.noscript-box {
  background: #FDF3D7;
  border: 2px solid var(--emas);
  color: #24357A;
  border-radius: 12px;
  padding: 18px;
  margin: 16px;
  text-align: center;
  font-weight: 500;
}

          </div>
          <div class="kartu-grid" id="beritaGrid"></div>
        </div>
      </div>

    </section>

    <!-- ======================= PROFIL ======================= -->
    <section id="profil" class="section bg-abu" aria-label="Profil">
      <div class="container">

          <p class="section-sub" id="profilSub"></p>
        </div>
        <div class="profil-grid reveal">
          <div class="visi-box">

            </div>

          <p class="section-sub" id="strukturSub"></p>

        <div class="program-grid" id="programGrid"></div>

          </div>
        </div>

          <div class="galeri-grid" id="galeriGrid"></div>
        </div>
      </div>

    <!-- ======================= KONTAK ======================= -->
    <section id="kontak" class="section bg-putih" aria-label="Kontak dan Aspirasi">

          <p class="section-sub" id="kontakSub"></p>
        </div>

        <div class="kontak-grid">

            <div class="info-list" id="infoList"></div>

          </div>
          <div class="map-card reveal" id="mapCard"></div>
        </div>

        <div class="form-card reveal">
          <h3 class="form-judul" id="formJudul"></h3>
          <p class="form-sub" id="formSub"></p>
          <form id="formAspirasi">
            <div class="form-grid">
              <div class="form-field">
                <label for="fNama" id="lblNama"></label>
                <input type="text" id="fNama" name="nama" autocomplete="name" required>
              </div>
              <div class="form-field">
                <label for="fRtrw" id="lblRtrw"></label>
                <input type="text" id="fRtrw" name="rtrw" autocomplete="off">
              </div>
              <div class="form-field">
                <label for="fKontak" id="lblKontak"></label>
                <input type="text" id="fKontak" name="kontak" autocomplete="off">
              </div>
              <div class="form-field">
                <label for="fJenis" id="lblJenis"></label>
                <select id="fJenis" name="jenis" required></select>
              </div>
              <div class="form-field form-field--full">
                <label for="fPesan" id="lblPesan"></label>
                <textarea id="fPesan" name="pesan" rows="5" required></textarea>
              </div>
            </div>
            <div class="form-aksi">
              <button type="submit" class="btn btn--wa" id="btnKirimWa"></button>
              <button type="button" class="btn btn--email" id="btnKirimEmail"></button>
            </div>
            <p class="form-catatan" id="formCatatan"></p>
          </form>
        </div>
      </div>
    </section>

/* ---------- Alat bantu: amankan teks agar tampil sebagai teks ---------- */

  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ---------- Sambutan ---------- */
function kartuSambutan(data) {
  const foto = data.foto
    ? `<img class="foto-img" src="${esc(data.foto)}" alt="${esc(data.altFoto)}">`
    : `<div class="foto-placeholder" role="img" aria-label="Tempat foto, belum diisi">${IKON.user}<span>Ganti dengan foto</span></div>`;
  const paragraf = data.paragraf.map((p) => `<p>${esc(p)}</p>`).join('');
  return `
    <article class="sambutan-card">
      <div class="foto-slot">
        ${foto}
        <span class="foto-ket">${esc(data.altFoto)}</span>
      </div>
      <div>
        <h2 class="sambutan-judul">${esc(data.judul)}</h2>
        <div class="sambutan-teks" style="margin-top:14px">${paragraf}</div>
        <div class="ttd">
          <div class="ttd-nama">${esc(data.ttdNama)}</div>
          <div class="ttd-jabatan">${esc(data.ttdJabatan)}</div>
        </div>
      </div>
    </article>`;
}

function ambilDataFormulir() {
  return {
    nama: document.getElementById('fNama').value.trim(),
    rtrw: document.getElementById('fRtrw').value.trim(),
    kontak: document.getElementById('fKontak').value.trim(),
    jenis: document.getElementById('fJenis').value,
    pesan: document.getElementById('fPesan').value.trim(),
  };
}

function susunTeksPesan(f) {
  let t = 'Pesan dari Website ' + DATA.umum.nama + '\n';
  t += 'Jenis Pesan: ' + f.jenis + '\n';
  t += 'Nama: ' + f.nama + '\n';
  if (f.rtrw) t += 'RT/RW: ' + f.rtrw + '\n';
  if (f.kontak) t += 'Kontak: ' + f.kontak + '\n';
  t += '\nIsi Pesan:\n' + f.pesan;
  return t;
}

function formValid() {
  const form = document.getElementById('formAspirasi');
  if (!form.checkValidity()) {
    form.reportValidity();
    return false;
  }
  return true;
}

function kirimWhatsApp(e) {
  e.preventDefault();
  if (!formValid()) return;
  const teks = susunTeksPesan(ambilDataFormulir());
  const url = 'https://wa.me/' + DATA.umum.whatsappNomor + '?text=' + encodeURIComponent(teks);
  window.open(url, '_blank', 'noopener');
}

function kirimEmail() {
  if (!formValid()) return;
  const f = ambilDataFormulir();
  const subjek = '[' + f.jenis + '] Pesan dari Website - ' + f.nama;
  const url = 'mailto:' + DATA.umum.email +
    '?subject=' + encodeURIComponent(subjek) +
    '&body=' + encodeURIComponent(susunTeksPesan(f));
  window.location.href = url;
}

/* ---------- Interaksi: menu ponsel ---------- */
function pasangMenuPonsel() {
  const toggle = document.getElementById('navToggle');
  const menu = document.getElementById('navMobile');
  const tutup = () => {
    menu.classList.remove('is-open');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'Buka menu navigasi');
  };
  toggle.addEventListener('click', () => {
    const buka = !menu.classList.contains('is-open');
    menu.classList.toggle('is-open', buka);
    toggle.setAttribute('aria-expanded', String(buka));
    toggle.setAttribute('aria-label', buka ? 'Tutup menu navigasi' : 'Buka menu navigasi');
  });
  menu.querySelectorAll('a').forEach((a) => a.addEventListener('click', tutup));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') tutup();
  });
  window.addEventListener('resize', () => {
    if (window.innerWidth >= 900) tutup();
  });
}

/* ---------- Interaksi: penanda menu aktif saat menggulir ---------- */
function pasangScrollSpy() {
  const tautan = document.querySelectorAll('[data-target]');
  const bagian = DATA.menu.map((m) => document.getElementById(m.href.slice(1))).filter(Boolean);
  if (!('IntersectionObserver' in window) || bagian.length === 0) return;
  const pengamat = new IntersectionObserver((entri) => {
    entri.forEach((en) => {
      if (!en.isIntersecting) return;
      tautan.forEach((t) => {
        const aktif = t.getAttribute('data-target') === en.target.id;
        t.classList.toggle('is-active', aktif);
        if (aktif) { t.setAttribute('aria-current', 'true'); } else { t.removeAttribute('aria-current'); }
      });
    });
  }, { rootMargin: '-42% 0px -52% 0px', threshold: 0 });
  bagian.forEach((b) => pengamat.observe(b));
}

/* ---------- Interaksi: animasi muncul saat digulir ---------- */
function pasangReveal() {
  const kurangiGerakan = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const elemen = document.querySelectorAll('.reveal');
  if (kurangiGerakan || !('IntersectionObserver' in window)) {
    elemen.forEach((el) => el.classList.add('is-visible'));
    return;
  }
  const pengamat = new IntersectionObserver((entri) => {
    entri.forEach((en) => {
      if (en.isIntersecting) {
        en.target.classList.add('is-visible');
        pengamat.unobserve(en.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
  elemen.forEach((el) => pengamat.observe(el));
}

/* ---------- Interaksi: tombol kembali ke atas ---------- */
function pasangKeAtas() {
  const tombol = document.getElementById('keAtas');
  const perbarui = () => {
    tombol.classList.toggle('is-visible', window.scrollY > 420);
  };
  window.addEventListener('scroll', perbarui, { passive: true });
  perbarui();
  tombol.addEventListener('click', () => {
    const kurangiGerakan = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: kurangiGerakan ? 'auto' : 'smooth' });
  });
}
